<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Laboratorio AI · CARE Conference</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" href="icons/app-favicon.png">
<!-- Presentazione "Laboratorio AI" (stile PowerPoint) per il secondo monitor: si apre da
     admin › Formazione › Laboratorio › Presenta. Palco fisso 1920×1080 scalato sulla finestra.
     Comandi: → ↓ PagGiù spazio Invio avanti · ← ↑ PagSu indietro · Home/Fine · F schermo intero
     · K o clic sul video = pausa/riprendi. La regia dell'admin comanda via BroadcastChannel('efg-lab').
     ?rec=1 nasconde comandi e inviti (per registrare il video della presentazione).
     ?embed=1: dentro l'admin, già a schermo intero sul proiettore (niente comandi, video che partono da soli).
     ?t=<id>: solo i passi di quel tutorial (tutorial/tutorials.js). -->
<style>
@font-face{font-family:'Montserrat';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/montserrat-latin-500-normal.woff2) format('woff2');}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/montserrat-latin-700-normal.woff2) format('woff2');}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/montserrat-latin-800-normal.woff2) format('woff2');}
@font-face{font-family:'Poppins';font-style:normal;font-weight:300;font-display:swap;src:url(fonts/poppins-latin-300-normal.woff2) format('woff2');}
@font-face{font-family:'Poppins';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/poppins-latin-400-normal.woff2) format('woff2');}
@font-face{font-family:'Poppins';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/poppins-latin-600-normal.woff2) format('woff2');}
@font-face{font-family:'Press Start 2P';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/press-start-2p-latin-400-normal.woff2) format('woff2');}
:root{
  --navy:#002238; --navy2:#0b3a5c; --orange:#f18c22; --sky:#8ad0ff; --ink:#0d2b45; --light:#eef4fa;
  --title:'Montserrat',system-ui,sans-serif; --body:'Poppins',system-ui,sans-serif; --pixel:'Press Start 2P',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;font-family:var(--body)}
body.idle,body.idle *{cursor:none!important}

/* palco 1920×1080 scalato al centro, bande nere ai lati */
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden;background:var(--navy)}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:sIn .45s ease}
@keyframes sIn{from{opacity:0}to{opacity:1}}

/* slide scure */
.dark{background:radial-gradient(120% 90% at 85% 0%,var(--navy2) 0%,var(--navy) 55%,#001522 100%)}
.dark .logo{position:absolute;left:96px;bottom:70px;height:46px;width:auto}
.wrap{position:absolute;left:180px;right:180px;top:50%;transform:translateY(-50%)}
.kicker{font-family:var(--title);font-weight:700;font-size:30px;letter-spacing:.32em;color:var(--sky);margin:0 0 26px}
h1,h2{font-family:var(--title);font-weight:800;margin:0;letter-spacing:-2px;line-height:1.02}
h2{font-size:132px}
.desc{font-size:44px;font-weight:300;line-height:1.35;margin:36px 0 0;max-width:1400px;color:#dbe9f5}
.desc b{font-weight:600;color:#fff}
.o{color:var(--orange)}

/* copertina */
.cover .wrap{text-align:center;left:120px;right:120px}
.cover h1{font-size:220px;letter-spacing:-6px}
.cover .care{font-family:var(--title);font-weight:700;font-size:42px;letter-spacing:.6em;color:var(--sky);margin-top:44px;padding-left:.6em}

.cover.thanks .care{font-family:var(--title);font-size:72px;font-weight:700;letter-spacing:-1px;padding-left:0;margin-top:30px;color:#fff}

/* domanda */
.ask .wrap{text-align:center}
.ask .q{font-family:var(--title);font-weight:800;font-size:300px;line-height:.9;color:var(--orange)}
.ask h2{font-size:84px;letter-spacing:-1.5px;margin-top:24px;line-height:1.12}
.ask .ex{display:flex;justify-content:center;flex-wrap:wrap;gap:22px;margin-top:64px}
.ask.next .q{font-size:200px}
.ask.next .ex{margin-top:48px}
.ask .ex span{font-size:34px;padding:16px 30px;border-radius:999px;border:2px solid rgba(138,208,255,.45);color:#e6f2fb}

/* GAME ON */
.gameon{position:absolute;right:120px;top:96px;font-family:var(--pixel);font-size:48px;color:var(--orange);text-shadow:6px 6px 0 #00111d;letter-spacing:4px}

/* video */
.vid{background:#000}
.vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.vid .cap{position:absolute;left:0;right:0;top:0;padding:40px 96px;font-family:var(--title);font-weight:700;font-size:40px;background:linear-gradient(180deg,rgba(0,0,0,.75),rgba(0,0,0,0));transition:opacity .6s}
.vid.playing .cap{opacity:0}
.vid .unmute{position:absolute;right:60px;bottom:60px;padding:18px 28px;border-radius:999px;background:rgba(0,0,0,.7);border:2px solid rgba(255,255,255,.5);color:#fff;font:600 30px var(--body);cursor:pointer;display:none}
.vid.muted .unmute{display:block}

/* passi del tutorial */
.tut{display:none;grid-template-columns:1060px 1fr}
.tut.on{display:grid}
.tut .im{background:var(--light);display:flex;align-items:center;justify-content:center;padding:70px}
.tut .im img{max-width:100%;max-height:100%;border-radius:14px;box-shadow:0 24px 60px rgba(13,43,69,.25);display:block}
.tut .tx{position:relative;padding:150px 90px 160px 80px;display:flex;flex-direction:column;justify-content:center;gap:22px}
.tut .src{font-family:var(--title);font-weight:700;font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:var(--sky)}
.tut .step{font-family:var(--title);font-weight:700;font-size:30px;color:var(--orange)}
.tut h3{font-family:var(--title);font-weight:800;font-size:64px;letter-spacing:-1.5px;line-height:1.08;margin:0}
.tut .body{font-size:30px;line-height:1.45;color:#dbe9f5}
.tut .body p{margin:0 0 10px}.tut .body ul{margin:6px 0 0;padding-left:1.1em}.tut .body b{color:#fff}
.tut .prompt{border-left:6px solid var(--orange);background:rgba(255,255,255,.07);padding:20px 26px;border-radius:8px;font-size:27px;line-height:1.45;font-style:italic;color:#fff}
.tut .time{align-self:flex-start;font-size:26px;padding:8px 18px;border-radius:999px;background:rgba(241,140,34,.18);color:#ffd2a1}
.tut .logo{left:1140px}

/* barra di avanzamento e numero */
#bar{position:absolute;left:0;bottom:0;height:10px;background:var(--orange);transition:width .4s ease;z-index:5}
#cnt{position:absolute;right:70px;bottom:44px;font:600 28px var(--title);color:rgba(255,255,255,.75);z-index:5}
#stage.isvid #cnt{display:none}
#cnt{display:none}   /* niente numero di pagina sulle slide */

/* comandi a comparsa (fuori dal palco, nella finestra) */
.nav{position:fixed;top:50%;transform:translateY(-50%);width:64px;height:64px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:30px;cursor:pointer;z-index:20;transition:opacity .3s}
#prev{left:18px}#next{right:18px}
#fs{position:fixed;right:18px;bottom:18px;z-index:20;padding:10px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.55);color:#fff;font:600 14px var(--body);cursor:pointer;transition:opacity .3s}
body.idle .nav,body.idle #fs{opacity:0;pointer-events:none}
#hint{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:21;padding:10px 20px;border-radius:999px;background:rgba(241,140,34,.95);color:#1d0f00;font:600 15px var(--body);cursor:pointer;white-space:nowrap}
body.fs #hint{display:none}
body.rec .nav,body.rec #fs,body.rec #hint{display:none!important}
</style>
</head>
<body>
<div id="stage" aria-live="polite">
  <div id="bar"></div><div id="cnt"></div>
</div>
<button class="nav" id="prev" type="button" aria-label="Slide precedente">←</button>
<button class="nav" id="next" type="button" aria-label="Slide successiva">→</button>
<button id="fs" type="button">Schermo intero</button>
<div id="hint" role="button" tabindex="0">Clicca una volta qui per lo schermo intero · frecce o telecomando per avanzare</div>

<script src="tutorial/tutorials.js?v=101"></script>
<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const QS = new URLSearchParams(location.search);
const REC = QS.get('rec') === '1';
const EMB = QS.get('embed') === '1';   // dentro l'admin, già a schermo intero sul proiettore: niente comandi né clic per lo schermo intero
if (REC || EMB) document.body.classList.add('rec');
const LOGO = '<img class="logo" src="img/efuture-logo-white.png" alt="efuture">';

/* ---------- le slide ---------- */
const DECK = [
  { title:'Laboratorio AI', cls:'dark cover', html:'<div class="wrap"><h1>Laboratorio <span class="o">AI</span></h1><div class="care">CARE CONFERENCE</div></div>' + LOGO },
  { title:'Claude, aiutami tu!', cls:'dark', html:'<div class="wrap"><p class="kicker">CLAUDE IN CHROME</p><h2>Claude, aiutami tu!</h2><p class="desc">Installa l\'estensione di Claude sul tuo browser e risolvi <b>operazioni quotidiane.</b></p></div>' + LOGO },
  { title:'Video: prenota con TheFork', video:'video/thefork-claude.mp4', poster:'video/thefork-claude.jpg', cap:'Claude in Chrome prenota un tavolo su TheFork' },
  { title:'E tu cosa potresti chiedere?', cls:'dark ask', html:'<div class="wrap"><div class="q">?</div><h2>E tu cosa potresti chiedere a Claude per le tue <span class="o">operazioni quotidiane?</span></h2><div class="ex"><span>Prenotare un ristorante</span><span>Inviare una mail</span><span>Compilare un foglio di calcolo</span><span>Confrontare offerte</span><span>Organizzare una trasferta</span></div></div>' + LOGO },
  { title:'Crea il tuo videogioco!', cls:'dark', html:'<div class="gameon">GAME ON</div><div class="wrap"><p class="kicker">CREA CON CLAUDE</p><h2>Crea il tuo videogioco!</h2><p class="desc">4 prompt e il gioco è fatto! Realizza la tua app in meno di 15 minuti.</p></div>' + LOGO },
  { title:'Video: Forza 4 con Claude', video:'video/forza4-claude.mp4', poster:'video/forza4-claude.jpg', cap:'Crea e gioca con Claude' },
];
// tutti i passi del tutorial Forza 4 (tutorial/tutorials.js); con ?t=<id> solo i passi di quel tutorial
const TID = QS.get('t');
if (TID) DECK.length = 0;
const TU = (window.EFG_TUTORIALS || []).find(t => t.id === (TID || 'forza4'));
if (TU) TU.slides.forEach(s => DECK.push({ title:s.h, tut:s, tuId:TU.id, tuName:TU.short || TU.title }));
// chiusura (solo nella presentazione completa, non con ?t=<id>)
if (!TID) DECK.push(
  { title:'E adesso?', cls:'dark ask next', html:'<div class="wrap"><div class="q">?</div><h2>Ho creato il mio primo videogioco. <span class="o">E adesso?</span></h2><div class="ex"><span>Come posso creare un’applicazione per la mia azienda?</span><span>Con quale scopo?</span><span>Come posso migliorare un processo aziendale?</span><span>Come posso digitalizzare un’operazione di routine?</span></div></div>' + LOGO },
  { title:'Grazie', cls:'dark cover thanks', html:'<div class="wrap"><h1>Grazie</h1><div class="care">e buona <span class="o">accelerazione…</span></div></div>' + LOGO });

const stage = $('stage'), N = DECK.length;
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
DECK.forEach((d, i) => {
  const el = document.createElement('section'); el.className = 'slide'; el.setAttribute('aria-label', (i + 1) + ' di ' + N + ': ' + d.title);
  if (d.video){
    el.classList.add('vid');
    el.innerHTML = '<video preload="auto" playsinline></video><div class="cap"></div><button class="unmute" type="button">🔇 Clic per attivare l\'audio</button>';
    const v = el.querySelector('video'); v.src = d.video; v.poster = d.poster || '';
    el.querySelector('.cap').textContent = d.cap || d.title;
    v.addEventListener('play', () => el.classList.add('playing'));
    v.addEventListener('click', e => { e.stopPropagation(); v.paused ? play(el) : v.pause(); });
    el.querySelector('.unmute').addEventListener('click', e => { e.stopPropagation(); v.muted = false; el.classList.remove('muted'); });
    d.el = el; d.v = v;
  } else if (d.tut){
    const s = d.tut;
    el.classList.add('dark', 'tut');
    el.innerHTML = '<div class="im"><img alt=""></div><div class="tx"><div class="src"></div><div class="step"></div><h3></h3><div class="body"></div></div>' + LOGO;
    el.querySelector('img').src = 'tutorial/' + d.tuId + '/' + s.img; el.querySelector('img').alt = s.h;
    el.querySelector('.src').textContent = 'Tutorial · ' + d.tuName;
    el.querySelector('.step').textContent = s.k; el.querySelector('h3').textContent = s.h;
    const body = el.querySelector('.body'); body.innerHTML = s.html;   // testo scritto da noi in tutorials.js
    const tx = el.querySelector('.tx');
    if (s.prompt){ const p = document.createElement('div'); p.className = 'prompt'; p.textContent = '“' + s.prompt + '”'; tx.appendChild(p); }
    if (s.time){ const t = document.createElement('span'); t.className = 'time'; t.textContent = '⏱ ' + s.time; tx.appendChild(t); }
    d.el = el;
  } else {
    el.className += ' ' + d.cls; el.innerHTML = d.html; d.el = el;
  }
  stage.insertBefore(el, $('bar'));
});

/* ---------- palco scalato ---------- */
function fit(){   // centrato con left/top 50% e translate(-50%,-50%), poi scalato dal centro
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = 'translate(-50%,-50%) scale(' + k + ')';
}
addEventListener('resize', fit); fit();

/* ---------- video ---------- */
function play(el){
  const v = el.querySelector('video');
  const p = v.play();
  if (p && p.catch) p.catch(() => { v.muted = true; el.classList.add('muted'); v.play().catch(() => {}); });   // audio bloccato: parte muto
}

/* ---------- navigazione ---------- */
let cur = -1;
const ch = ('BroadcastChannel' in window) ? new BroadcastChannel('efg-lab') : null;
const tell = () => { if (ch) ch.postMessage({ type:'state', i:cur, n:N, title:DECK[cur].title }); };
function go(i){
  i = Math.max(0, Math.min(N - 1, i));
  if (i === cur) return tell();
  if (cur >= 0){ const o = DECK[cur]; o.el.classList.remove('on'); if (o.v){ o.v.pause(); } }
  cur = i; const d = DECK[cur];
  d.el.classList.add('on');
  stage.classList.toggle('isvid', !!d.v);
  if (d.v && !REC){ d.el.classList.remove('playing'); try { d.v.currentTime = 0; } catch(e){} play(d.el); }
  $('bar').style.width = ((cur + 1) / N * 100) + '%';
  $('cnt').textContent = (cur + 1) + ' / ' + N;
  if (location.hash !== '#' + (cur + 1)) history.replaceState(null, '', '#' + (cur + 1));
  tell();
}
const next = () => go(cur + 1), prev = () => go(cur - 1);
function full(){
  const el = document.documentElement;
  if (document.fullscreenElement) document.exitFullscreen && document.exitFullscreen();
  else if (el.requestFullscreen) el.requestFullscreen({ navigationUI:'hide' }).catch(() => {});
}
document.addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(k)){ e.preventDefault(); next(); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(k)){ e.preventDefault(); prev(); }
  else if (k === 'Home'){ e.preventDefault(); go(0); }
  else if (k === 'End'){ e.preventDefault(); go(N - 1); }
  else if (k === 'f' || k === 'F'){ full(); }
  else if (k === 'k' || k === 'K'){ const d = DECK[cur]; if (d.v){ d.v.paused ? play(d.el) : d.v.pause(); } }
});
$('next').onclick = e => { e.stopPropagation(); next(); };
$('prev').onclick = e => { e.stopPropagation(); prev(); };
$('fs').onclick = e => { e.stopPropagation(); full(); };
$('hint').onclick = e => { e.stopPropagation(); full(); };
document.addEventListener('click', () => { if (!document.fullscreenElement && !REC && !EMB) full(); });   // un clic: schermo intero
document.addEventListener('fullscreenchange', () => {
  document.body.classList.toggle('fs', !!document.fullscreenElement);
  $('fs').textContent = document.fullscreenElement ? 'Esci da schermo intero' : 'Schermo intero';
});
addEventListener('hashchange', () => { const n = parseInt(location.hash.slice(1), 10); if (n >= 1) go(n - 1); });

/* comandi e cursore spariscono dopo 2,5 s senza muovere il mouse */
let idleT = 0;
function wake(){ document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 2500); }
addEventListener('mousemove', wake); wake();

/* regia dall'admin (stesso sito, stesso browser) */
if (ch){
  ch.onmessage = e => {
    const m = e.data || {};
    if (m.type === 'next') next(); else if (m.type === 'prev') prev();
    else if (m.type === 'go') go(m.i | 0); else if (m.type === 'ping') tell();
    else if (m.type === 'play'){ const d = DECK[cur]; if (d.v){ d.v.paused ? play(d.el) : d.v.pause(); } }
  };
  addEventListener('pagehide', () => ch.postMessage({ type:'bye' }));
}

go((parseInt(location.hash.slice(1), 10) || 1) - 1);
})();
</script>
</body>
</html>
