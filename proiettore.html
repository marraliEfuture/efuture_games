<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Proiettore · Efuture Games</title>
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" href="icons/app-favicon.png">
<!-- Finestra del proiettore per admin › Formazione › Laboratorio › Presenta.
     La apre l'admin sul secondo monitor; l'admin resta al suo posto e fa da regia.
     Riceve dall'admin (postMessage, stesso sito) { type:'show', url } con il permesso di andare a schermo intero
     (Capability Delegation, delegate:'fullscreen'): carica la presentazione e va a schermo intero senza clic qui.
     Risponde { type:'fs', ok }. Se il browser non lo consente, un clic qui mette lo schermo intero.
     Le frecce e il telecomando premuti qui comandano la presentazione (BroadcastChannel 'efg-lab'). -->
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#fff}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
#idle{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#idle img{width:min(360px,40vw);opacity:.85}
#tap{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:5;padding:10px 20px;border-radius:999px;background:rgba(241,140,34,.95);color:#1d0f00;font:600 15px system-ui,sans-serif;cursor:pointer;white-space:nowrap}
:fullscreen #tap{display:none}
</style>
</head>
<body>
<div id="idle"><img src="img/efuture-logo-white.png" alt="efuture"></div>
<iframe id="f" title="Presentazione" allow="autoplay; fullscreen" hidden></iframe>
<div id="tap" role="button" tabindex="0" hidden>Clicca una volta qui per lo schermo intero</div>
<script>
(function(){
"use strict";
const f = document.getElementById('f'), tap = document.getElementById('tap');
const ch = ('BroadcastChannel' in window) ? new BroadcastChannel('efg-lab') : null;
const ok = u => { try { const x = new URL(u, location.href); return x.origin === location.origin && /\/laboratorio\.html$/.test(x.pathname); } catch (e) { return false; } };
function show(u){
  if (!ok(u)) return;
  const abs = new URL(u, location.href).href;
  if (f.src !== abs) f.src = abs;
  f.hidden = false;
}
function blank(){ f.hidden = true; f.src = 'about:blank'; }
async function full(){
  if (document.fullscreenElement) return true;
  try { await document.documentElement.requestFullscreen({ navigationUI:'hide' }); return true; } catch (e) { tap.hidden = false; return false; }
}
addEventListener('message', async e => {
  if (e.origin !== location.origin || !e.data) return;
  const m = e.data;
  if (m.type === 'show'){ const r = full(); show(m.url); const done = await r; if (e.source) e.source.postMessage({ type:'fs', ok: done }, location.origin); f.focus(); }
  else if (m.type === 'blank') blank();
});
if (ch) ch.addEventListener('message', e => { if ((e.data || {}).type === 'stop') blank(); });
tap.onclick = () => full();
document.addEventListener('click', () => full());
document.addEventListener('fullscreenchange', () => { tap.hidden = !!document.fullscreenElement; });
// frecce e telecomando premuti su questa finestra (fuori dalla presentazione)
document.addEventListener('keydown', e => {
  if (!ch) return;
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)){ e.preventDefault(); ch.postMessage({ type:'next' }); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)){ e.preventDefault(); ch.postMessage({ type:'prev' }); }
});
const u0 = new URLSearchParams(location.search).get('u');
if (u0) show(u0);
if (window.opener) window.opener.postMessage({ type:'pronto' }, location.origin);
})();
</script>
</body>
</html>
